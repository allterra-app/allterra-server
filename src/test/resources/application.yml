spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  datasource:
    username: sa
    password: password
    url: jdbc:h2:mem:allterradb;DB_CLOSE_DELAY=-1
  liquibase:
    change-log: /database/liquibase/master.xml
    url: jdbc:h2:mem:allterradb;DB_CLOSE_DELAY=-1
    user: sa
    password: password
    driver-class-name: org.h2.Driver

server:
  servlet:
    context-path: /api/v1

security:
  require-https: false
  rate-limit:
    login:
      max-attempts: 1000
      window-seconds: 60
  jwt:
    secret: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ==
