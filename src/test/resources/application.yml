spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  datasource:
    username: sa
    password: password
    url: jdbc:h2:mem:allterradb
  liquibase:
    change-log: /database/liquibase/master.xml
    url: jdbc:h2:mem:allterradb
    user: sa
    password: password
    driver-class-name: org.h2.Driver
