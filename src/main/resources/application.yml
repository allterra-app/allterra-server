server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api/v1
spring:
  application:
    name: allterra
  banner:
    location: banner.txt
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  datasource:
    username: root
    password: root
    url: jdbc:postgresql://postgres:5432/allterradb?currentSchema=allterra
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  liquibase:
    change-log: classpath:database/liquibase/master.xml
    url: jdbc:postgresql://postgres:5432/allterradb?currentSchema=allterra
    user: root
    password: root
    driver-class-name: org.postgresql.Driver
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - info
          - health
          - liquibase
          - metrics
          - shutdown
          - prometheus
  server:
    port: 8081

springdoc:
  api-docs:
    path: /api-doc

logging:
  config: classpath:log4j2.xml

security:
  require-https: ${SECURITY_REQUIRE_HTTPS:true}
  rate-limit:
    login:
      max-attempts: ${SECURITY_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${SECURITY_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  jwt:
    # Base64 encoded 64+ byte secret for HS512
    secret: ${JWT_SECRET}
    # Previous key for key rotation (optional)
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    current-key-id: ${JWT_CURRENT_KEY_ID:current}
    # Access token should be short-lived for mobile API.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    # Refresh token should be long-lived and rotatable.
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
    issuer: ${JWT_ISSUER:allterra-server}
    audience: ${JWT_AUDIENCE:allterra-client}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
  seed-admin:
    enabled: ${SEED_ADMIN_ENABLED:false}
    email: ${SEED_ADMIN_EMAIL:admin@allterra.local}
    password: ${SEED_ADMIN_PASSWORD:}

allterra:
  media:
    local-storage-path: ${MEDIA_STORAGE_PATH:/tmp/allterra-media}
